<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POP GAMING — Official HQ</title>
    <style>
        :root {
            --bg-dark: #06080c;
            --bg-card: #0f1420;
            --accent: #00f3ff;
            --accent-hover: #00c4cf;
            --yt-red: #ff0033;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        html, body {
            height: auto !important;
            overflow: auto !important;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
            margin: 0;
            padding: 0;
        }
        * {
            box-sizing: border-box;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(6, 8, 12, 0.95);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }
        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 115px 8% 95px;
            background: radial-gradient(circle at top, #122136 0%, var(--bg-dark) 70%);
        }
        .hero h1 {
            font-size: 3.3rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 22px rgba(0, 243, 255, 0.45);
        }
        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto 32px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 13px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            display: inline-block;
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }
        .btn-yt {
            background: var(--yt-red);
            color: #fff;
        }
        .btn-yt:hover {
            background: #cc0029;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
        }

        /* Sections General */
        section {
            padding: 75px 8%;
            max-width: 1150px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .section-title span {
            color: var(--accent);
        }
        .section-sub {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 45px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Story Box */
        .story-box {
            background: var(--bg-card);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 35px;
            font-size: 1.08rem;
            color: #e2e8f0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .story-box p {
            margin-bottom: 15px;
        }
        .story-box p:last-child {
            margin-bottom: 0;
        }

        /* Hardware Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 25px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 30px;
            transition: transform 0.3s, border-color 0.3s;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }
        .card-badge {
            display: inline-block;
            background: rgba(0, 243, 255, 0.12);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Apply Link Box */
        .apply-box {
            background: var(--bg-card);
            border: 2px solid var(--accent);
            border-radius: 14px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        }
        .apply-box h2 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 12px;
        }
        .apply-box p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 25px;
        }
        .form-direct-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            font-size: 1.05rem;
            word-break: break-all;
            text-decoration: underline;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 35px 8%;
            border-top: 1px solid #1e293b;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 50px;
        }
        footer span {
            color: var(--accent);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">POP GAMING</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#story">Our Story</a></li>
            <li><a href="#hardware">Hardware & R&D</a></li>
