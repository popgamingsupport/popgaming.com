<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POP GAMING — Official HQ</title>
    <style>
        :root {
            --bg-dark: #06080c;
            --bg-card: #0f1420;
            --accent: #00f3ff;
            --accent-hover: #00c4cf;
            --yt-red: #ff0033;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(6, 8, 12, 0.95);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }
        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 115px 8% 95px;
            background: radial-gradient(circle at top, #122136 0%, var(--bg-dark) 70%);
        }
        .hero h1 {
            font-size: 3.3rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 22px rgba(0, 243, 255, 0.45);
        }
        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto 32px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 13px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            display: inline-block;
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }
        .btn-yt {
            background: var(--yt-red);
            color: #fff;
        }
        .btn-yt:hover {
            background: #cc0029;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
        }

        /* Sections General */
        section {
            padding: 75px 8%;
            max-width: 1150px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .section-title span {
            color: var(--accent);
        }
        .section-sub {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 45px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }
